name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = ([xml](Get-Content -Raw Directory.Build.props)).Project.PropertyGroup.Version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match Directory.Build.props' }
      - name: Cache pinned native archive
        uses: actions/cache@v4
        with:
          path: work/downloads/iPhoneMirror-v1.8.3-win-x64.zip
          key: native-1.8.3-97c5ded39a943706
      - name: Build, test and package
        shell: pwsh
        run: ./package.ps1 -SkipNativeCheck
      # Hosted runners have no physical iPhone, Bluetooth radio or desktop.
      - uses: actions/upload-artifact@v4
        with:
          name: WiredMirror-windows-x64
          path: outbox/*.zip
      - name: Publish stable GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = ([xml](Get-Content -Raw Directory.Build.props)).Project.PropertyGroup.Version
          gh release create $env:GITHUB_REF_NAME --verify-tag --title "WiredMirror $version" --notes-file RELEASE_NOTES.md "outbox/WiredMirror-$version-windows-x64.zip" "outbox/WiredMirror-$version-source.zip" "outbox/WiredMirror-$version-SHA256SUMS.txt"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed' }
